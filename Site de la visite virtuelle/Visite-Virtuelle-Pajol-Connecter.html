<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Panoramic Tour with Live Weather</title>
  <link href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" rel="stylesheet" />
  <style>
    /* Panorama container */
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Weather panel */
    #weather-panel {
      position: absolute;
      top: 50px;
      right: 30px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.70);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      font-family: 'Segoe UI', sans-serif;
      width: 260px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .weather-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .weather-icon {
      width: 50px;
      height: 50px;
      margin-right: 12px;
    }
    .weather-location {
      font-weight: 600;
      margin: 0 0 3px 0;
      font-size: 16px;
    }
    .weather-condition {
      color: #555;
      margin: 0;
      font-size: 14px;
    }
    .weather-temp {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 15px 0;
      color: #333;
    }
    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .weather-item {
      display: flex;
      flex-direction: column;
    }
    .weather-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 2px;
    }
    .weather-value {
      font-size: 14px;
      font-weight: 500;
    }
    .weather-update {
      font-size: 11px;
      color: #999;
      text-align: right;
      margin-top: 10px;
    }
    .error-message {
      color: red;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
    
    /* Hotspot styling */
    .pnlm-hotspot.pnlm-scene {
      width: 60px !important;
      height: 60px !important;
      background-image: url('https://raw.githubusercontent.com/zyy807/multi-scene-images/main/images/arrow.png') !important;
      background-color: transparent !important;
      background-size: contain !important;
      background-repeat: no-repeat !important;
      background-position: center center !important;
    }

    .pnlm-tooltip {
      font-size: 16px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
    }

    /* Environment Data Panel */
    .sensor-panel {
      position: fixed;
      top: 20%;
      left: 85%;
      transform: translate(-50%, -50%);
      width: 300px;
      max-width: 90vw;
      height: 280px;
      max-height: 80vh;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      z-index: 1000;
      overflow: auto;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .sensor-panel {
  	padding: 25px 50px; 
    }

    .sensor-panel button {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 15px;
      cursor: pointer;
      outline: none;
      transition: color 0.3s;
    }

    .sensor-panel button:hover {
      color: #e74c3c;
    }

    .sensor-panel h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    .sensor-item {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    .sensor-label {
      font-weight: bold;
      color: #2c3e50;
    }

    .sensor-value {
      color: #3498db;
    }
  </style>
</head>
<body>
  <!-- Panorama container -->

    <!-- Weather panel positioned here -->
    <div id="weather-panel">
      <div class="weather-header">
        <img id="weather-icon" class="weather-icon" src="https://cdn.weatherapi.com/weather/64x64/day/116.png">
        <div>
          <h3 class="weather-location">Paris</h3>
          <p id="weather-condition" class="weather-condition">--</p>
        </div>
      </div>
      <p id="weather-temp" class="weather-temp">--°C</p>
      
      <div class="weather-grid">
        <div class="weather-item">
          <span class="weather-label">Feels Like</span>
          <span id="feels-like" class="weather-value">--°C</span>
        </div>
        <div class="weather-item">
          <span class="weather-label">Humidity</span>
          <span id="humidity" class="weather-value">--%</span>
        </div>
        <div class="weather-item">
          <span class="weather-label">Wind Speed</span>
          <span id="wind" class="weather-value">-- km/h</span>
        </div>
        <div class="weather-item">
          <span class="weather-label">Pressure</span>
          <span id="pressure" class="weather-value">-- hPa</span>
        </div>
        <div class="weather-item">
          <span class="weather-label">Precipitation</span>
          <span id="precip" class="weather-value">-- mm</span>
        </div>
        <div class="weather-item">
          <span class="weather-label">Visibility</span>
          <span id="visibility" class="weather-value">-- km</span>
        </div>
        <div class="weather-item">
          <span class="weather-label">UV Index</span>
          <span id="uv" class="weather-value">--</span>
        </div>
        <div class="weather-item">
          <span class="weather-label">Wind Direction</span>
          <span id="wind-dir" class="weather-value">--</span>
        </div>
      </div>
      
      <p id="update-time" class="weather-update">Last updated: --:--</p>
      <div id="error-message" class="error-message"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    const UPDATE_INTERVAL = 10 * 60 * 1000; 

    // Wind direction translation
    const windDirectionMap = {
      "N": "North", "NNE": "NNE", "NE": "NE", "ENE": "ENE",
      "E": "East", "ESE": "ESE", "SE": "SE", "SSE": "SSE",
      "S": "South", "SSW": "SSW", "SW": "SW", "WSW": "WSW",
      "W": "West", "WNW": "WNW", "NW": "NW", "NNW": "NNW"
    };

    // Environment Data Panel Management
    let currentPanel = null;
    let updateInterval = null;

    function showEnvironmentPanel(roomName) {
      // If panel already exists, remove it
      if (currentPanel) {
        document.body.removeChild(currentPanel);
        clearInterval(updateInterval);
      }
      
      // Create panel element
      const panel = document.createElement('div');
      panel.className = 'sensor-panel';
      
      // Add close button
      const closeBtn = document.createElement('button');
      closeBtn.innerHTML = '×';
      closeBtn.onclick = function() {
        clearInterval(updateInterval);
        document.body.removeChild(panel);
        currentPanel = null;
        updateInterval = null;
      };
      panel.appendChild(closeBtn);
      
      // Add title
      const title = document.createElement('h2');
      title.innerHTML = roomName + ' Environment Data';
      panel.appendChild(title);
      
      // Add data container
      const dataContainer = document.createElement('div');
      dataContainer.id = 'sensor-data-container';
      panel.appendChild(dataContainer);
      
      // Add loading message
      dataContainer.innerHTML = '<p>Loading data...</p>';
      
      // Add to document
      document.body.appendChild(panel);
      currentPanel = panel;
      
      // Fetch and display data
      function fetchAndDisplayData() {
        const today = new Date().toISOString().split('T')[0];
	const baseUrl = window.location.origin;
	console.log(baseUrl);
        fetch(`${baseUrl}/capteurs/${roomName}/date/${today}`)
          .then(response => response.json())
          .then(data => {
            if (data && data.length > 0) {
              const latestData = data[data.length - 1];
              displaySensorData(dataContainer, latestData, roomName);
            } else {
              dataContainer.innerHTML = '<p>No data available for today.</p>';
            }
          })
          .catch(error => {
            dataContainer.innerHTML = '<p>Error loading sensor data. Please try again later.</p>';
            console.error('Error fetching sensor data:', error);
          });
      }
      
      // Initial load
      fetchAndDisplayData();
      
      // Set interval to update every 5 minutes
      updateInterval = setInterval(fetchAndDisplayData, 5 * 60 * 1000);
    }

    function displaySensorData(container, data, roomName) {
      container.innerHTML = `
        <div class="sensor-item">
          <span class="sensor-label">Room:</span>
          <span class="sensor-value">${roomName}</span>
        </div>
        <div class="sensor-item">
          <span class="sensor-label">Temperature:</span>
          <span class="sensor-value">${data.Temperature} °C</span>
        </div>
        <div class="sensor-item">
          <span class="sensor-label">Humidity:</span>
          <span class="sensor-value">${data.Humidite} %</span>
        </div>
        <div class="sensor-item">
          <span class="sensor-label">CO2:</span>
          <span class="sensor-value">${data.CO2} ppm</span>
        </div>
        <div class="sensor-item">
          <span class="sensor-label">Light:</span>
          <span class="sensor-value">${data.Eclairement} lux</span>
        </div>
        <div class="sensor-item">
          <span class="sensor-label">Last Update:</span>
          <span class="sensor-value">${data.Timestamp}</span>
        </div>

    // Fetch weather data
    async function fetchWeather() {
      try {
        const response = await fetch(API_URL);
        
        if (!response.ok) {
          throw new Error(`API request failed: ${response.status}`);
        }
        
        const data = await response.json();
        updateWeatherUI(data);
        document.getElementById('error-message').textContent = '';
      } catch (error) {
        console.error('Failed to fetch weather data:', error);
        document.getElementById('error-message').textContent = 
          `Failed to load weather data: ${error.message}`;
      }
    }

    // Update weather UI
    function updateWeatherUI(data) {
      const current = data.current;
      
      // Update icon and basic info
      const iconUrl = current.condition.icon.startsWith('//') 
        ? 'https:' + current.condition.icon 
        : current.condition.icon;
      document.getElementById('weather-icon').src = iconUrl;
      
      document.getElementById('weather-condition').textContent = 
        current.condition.text;
      document.getElementById('weather-temp').textContent = 
        `${Math.round(current.temp_c)}°C`;
      
      // Update detailed data
      document.getElementById('feels-like').textContent = 
        `${Math.round(current.feelslike_c)}°C`;
      document.getElementById('humidity').textContent = 
        `${current.humidity}%`;
      document.getElementById('wind').textContent = 
        `${current.wind_kph} km/h`;
      document.getElementById('pressure').textContent = 
        `${current.pressure_mb} hPa`;
      document.getElementById('precip').textContent = 
        `${current.precip_mm} mm`;
      document.getElementById('visibility').textContent = 
        `${current.vis_km} km`;
      document.getElementById('uv').textContent = 
        current.uv.toFixed(1);
      document.getElementById('wind-dir').textContent = 
        windDirectionMap[current.wind_dir] || current.wind_dir;
      
      // Update time display
      const updateTime = new Date(data.current.last_updated_epoch * 1000);
      const hours = updateTime.getHours().toString().padStart(2, '0');
      const minutes = updateTime.getMinutes().toString().padStart(2, '0');
      document.getElementById('update-time').textContent = 
        `Last updated: ${hours}:${minutes}`;
    }

    // Scene change handler
    viewer.on('scenechange', function(sceneId) {
      const weatherPanel = document.getElementById('weather-panel');
      if (sceneId === 'scene1') {
        weatherPanel.style.display = 'block';
        fetchWeather();
      } else {
        weatherPanel.style.display = 'none';
      }
    });

    // Initial load
    fetchWeather();
    setInterval(fetchWeather, UPDATE_INTERVAL);

    // Retry button functionality
    document.getElementById('weather-panel').addEventListener('click', function(e) {
      if (e.target.id === 'error-message') {
        fetchWeather();
      }
    });

    // Window resize handler
    window.addEventListener("resize", function() {
      viewer.getContainer().style.width = window.innerWidth + "px";
      viewer.getContainer().style.height = window.innerHeight + "px";
      viewer.resize();
